<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Contact CTA</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
        color: #222;
      }

      .contact-cta {
        position: relative;
        min-height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 42px 24px;
        background:
          radial-gradient(
            circle at 50% 45%,
            rgba(0, 0, 0, 0.035),
            transparent 42%
          ),
          #fff;
      }

      /* Soft skyline */
      .contact-cta::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 28px;
        height: 170px;
        opacity: 0.12;
        background:
          linear-gradient(to top, rgba(80, 80, 80, 0.45), rgba(80, 80, 80, 0))
            50% 100%/6px 210px no-repeat,
          linear-gradient(to top, rgba(80, 80, 80, 0.35), rgba(80, 80, 80, 0))
            16% 100%/24px 105px no-repeat,
          linear-gradient(to top, rgba(80, 80, 80, 0.28), rgba(80, 80, 80, 0))
            23% 100%/16px 150px no-repeat,
          linear-gradient(to top, rgba(80, 80, 80, 0.35), rgba(80, 80, 80, 0))
            31% 100%/30px 120px no-repeat,
          linear-gradient(to top, rgba(80, 80, 80, 0.32), rgba(80, 80, 80, 0))
            38% 100%/22px 178px no-repeat,
          linear-gradient(to top, rgba(80, 80, 80, 0.38), rgba(80, 80, 80, 0))
            48.5% 100%/34px 245px no-repeat,
          linear-gradient(to top, rgba(80, 80, 80, 0.28), rgba(80, 80, 80, 0))
            58% 100%/26px 118px no-repeat,
          linear-gradient(to top, rgba(80, 80, 80, 0.3), rgba(80, 80, 80, 0))
            66% 100%/18px 155px no-repeat,
          linear-gradient(to top, rgba(80, 80, 80, 0.26), rgba(80, 80, 80, 0))
            76% 100%/30px 110px no-repeat,
          linear-gradient(to top, rgba(80, 80, 80, 0.34), rgba(80, 80, 80, 0))
            86% 100%/18px 138px no-repeat;
        pointer-events: none;
      }

      .cta-wrap {
        position: relative;
        width: min(1460px, 100%);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        align-items: center;
        z-index: 2;
      }

      .cta-wrap::before {
        content: "";
        position: absolute;
        left: 15%;
        right: 15%;
        top: 50%;
        height: 2px;
        z-index: -2;
        transform: translateY(-50%);
        background: repeating-linear-gradient(
          90deg,
          rgba(30, 30, 30, 0.2) 0 7px,
          transparent 7px 14px
        );
        background-size: 28px 2px;
        animation: connectorFlow 2.4s linear infinite;
      }

      .cta-wrap::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 16%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e31f26;
        box-shadow: 0 0 0 6px rgba(227, 31, 38, 0.1);
        transform: translateY(-50%);
        z-index: -1;
        animation: travelDot 5.8s ease-in-out infinite;
      }

      .cta-card {
        --accent: #e31f26;
        position: relative;
        min-height: 112px;
        padding: 20px 22px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        gap: 16px;
        color: #fff;
        background: var(--accent);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.11);
        text-decoration: none;
        isolation: isolate;
        overflow: visible;
        animation:
          floatCard 6s ease-in-out infinite,
          cardReveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        transition:
          transform 0.35s ease,
          box-shadow 0.35s ease,
          filter 0.35s ease;
        will-change: transform;
      }

      .cta-card:nth-child(1) {
        animation-delay: 0s, 0.05s;
      }
      .cta-card:nth-child(2) {
        animation-delay: 0.55s, 0.18s;
      }
      .cta-card:nth-child(3) {
        animation-delay: 1.1s, 0.31s;
      }

      .cta-card:hover {
        transform: translateY(-5px) scale(1.01);
        box-shadow: 0 20px 42px rgba(0, 0, 0, 0.16);
        filter: saturate(1.08);
      }

      .cta-card::before {
        content: "";
        position: absolute;
        width: 132px;
        height: 132px;
        border: 2px dashed var(--accent);
        border-radius: 50%;
        left: -12px;
        top: 50%;
        transform: translateY(-50%);
        z-index: -2;
        animation:
          spinRing 12s linear infinite,
          ringPulse 3.2s ease-in-out infinite;
        opacity: 0.48;
      }

      .cta-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 14px;
        background:
          linear-gradient(120deg, rgba(255, 255, 255, 0.13), transparent 38%),
          linear-gradient(
            105deg,
            transparent 30%,
            rgba(255, 255, 255, 0.18) 48%,
            transparent 66%
          );
        background-size:
          100% 100%,
          220% 100%;
        background-position:
          0 0,
          180% 0;
        z-index: -1;
        pointer-events: none;
        animation: cardShine 5.2s ease-in-out infinite;
      }

      .cta-card.dark {
        --accent: #303030;
        background: #303030;
      }

      .cta-card.green {
        --accent: #08a73f;
        background: linear-gradient(135deg, #089d3c, #10b94b);
      }

      .icon-box {
        flex: 0 0 72px;
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        transform: translateZ(0);
        transition: transform 0.35s ease;
        position: relative;
        overflow: hidden;
      }

      .icon-box::after {
        content: "";
        position: absolute;
        width: 34px;
        height: 130%;
        top: -15%;
        left: -60px;
        transform: rotate(18deg);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.9),
          transparent
        );
        animation: iconSweep 4.4s ease-in-out infinite;
        pointer-events: none;
      }

      .cta-card:hover .icon-box {
        transform: rotate(-5deg) scale(1.06);
      }

      .icon-box svg {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: iconBreathe 2.8s ease-in-out infinite;
      }

      .cta-content h3 {
        margin: 0 0 6px;
        font-size: clamp(20px, 1.6vw, 26px);
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.02em;
        position: relative;
        display: inline-block;
      }

      .cta-content h3::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -3px;
        width: 0;
        height: 1px;
        background: rgba(255, 255, 255, 0.7);
        transition: width 0.35s ease;
      }

      .cta-card:hover .cta-content h3::after {
        width: 100%;
      }

      .cta-content p {
        margin: 0;
        font-size: clamp(14px, 1vw, 17px);
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.92);
      }

      .dot {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        top: 50%;
        right: -21px;
        transform: translateY(-50%);
        box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.95);
        animation: pulse 2s ease-in-out infinite;
      }

      .cta-card:last-child .dot {
        display: none;
      }

      @keyframes floatCard {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      @keyframes cardReveal {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes connectorFlow {
        to {
          background-position: 28px 0;
        }
      }

      @keyframes travelDot {
        0%,
        100% {
          left: 16%;
          background: #e31f26;
          box-shadow: 0 0 0 6px rgba(227, 31, 38, 0.1);
        }
        48% {
          left: 50%;
          background: #303030;
          box-shadow: 0 0 0 6px rgba(48, 48, 48, 0.1);
        }
        96% {
          left: 82%;
          background: #08a73f;
          box-shadow: 0 0 0 6px rgba(8, 167, 63, 0.1);
        }
      }

      @keyframes cardShine {
        0%,
        62% {
          background-position:
            0 0,
            180% 0;
        }
        78%,
        100% {
          background-position:
            0 0,
            -40% 0;
        }
      }

      @keyframes iconSweep {
        0%,
        58% {
          left: -60px;
        }
        75%,
        100% {
          left: 110px;
        }
      }

      @keyframes iconBreathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }

      @keyframes spinRing {
        to {
          transform: translateY(-50%) rotate(360deg);
        }
      }

      @keyframes ringPulse {
        0%,
        100% {
          opacity: 0.32;
        }
        50% {
          opacity: 0.58;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: translateY(-50%) scale(1);
        }
        50% {
          transform: translateY(-50%) scale(1.25);
        }
      }

      @keyframes dashMove {
        0% {
          transform: translateY(-50%) translateX(0);
        }
        50% {
          transform: translateY(-50%) translateX(8px);
        }
        100% {
          transform: translateY(-50%) translateX(0);
        }
      }

      @media (max-width: 1100px) {
        .cta-wrap {
          grid-template-columns: 1fr;
          gap: 34px;
          max-width: 760px;
        }
        .cta-wrap::before {
          display: none;
        }
        .cta-card {
          min-height: 142px;
        }
        .dot {
          display: none;
        }
        .cta-card::before {
          width: 150px;
          height: 150px;
        }
      }

      @media (max-width: 600px) {
        .contact-cta {
          min-height: auto;
          padding: 30px 16px;
        }
        .cta-card {
          padding: 18px;
          gap: 16px;
          border-radius: 16px;
        }
        .icon-box {
          flex-basis: 64px;
          width: 64px;
          height: 64px;
          border-radius: 14px;
        }
        .icon-box svg {
          width: 32px;
          height: 32px;
        }
        .cta-card::before {
          width: 120px;
          height: 120px;
          left: -18px;
        }
        .cta-content h3 {
          margin-bottom: 6px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <section class="contact-cta">
      <div class="cta-wrap">
        <a class="cta-card" href="tel:+971555515475" aria-label="Call Us">
          <span class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"
              />
            </svg>
          </span>
          <span class="cta-content">
            <h3>Speak to an Expert</h3>
            <p>Call our team</p>
          </span>
          <span class="dot"></span>
        </a>

        <a
          class="cta-card dark"
          href="mailto:info@redspider.ae"
          aria-label="Send Enquiry"
        >
          <span class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              />
              <path d="m22 6-10 7L2 6" />
            </svg>
          </span>
          <span class="cta-content">
            <h3>Send an Enquiry</h3>
            <p>info@redspider.ae</p>
          </span>
          <span class="dot"></span>
        </a>

        <a
          class="cta-card green"
          href="https://wa.me/971555515475"
          target="_blank"
          rel="noopener"
          aria-label="WhatsApp Us"
        >
          <span class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.2 9.2 0 0 1-3.8-.9L3 20.5l1.5-5a8.5 8.5 0 1 1 16.5-4z"
              />
              <path d="M8.2 8.1c.4 3 2.7 5.3 5.7 5.8" />
              <path d="M13.9 13.9l1.5-1.1" />
              <path d="M8.2 8.1l1.1-1.5" />
            </svg>
          </span>
          <span class="cta-content">
            <h3>WhatsApp Us</h3>
            <p>+971 55 551 5475</p>
          </span>
        </a>
      </div>
    </section>
  </body>
</html>
